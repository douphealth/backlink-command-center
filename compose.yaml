services:
  dashboard:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PR_DB_PATH: /app/state/outreach.sqlite3
      DASHBOARD_COOKIE_SECURE: "false"
    # This compose variant is for private HTTP over a localhost/SSH tunnel.
    # Set DASHBOARD_COOKIE_SECURE=true behind HTTPS when publishing through a proxy.
    ports:
      # Local-only: connect via SSH tunnel or secure authenticated HTTPS reverse proxy.
      - "127.0.0.1:8080:8080"
    volumes:
      - ${PR_WORKER_STATE_DIR:?Set a host directory mapped to the REAL worker database}:/app/state
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 80
    mem_limit: 256m
