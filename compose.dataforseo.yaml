services:
  worker:
    environment:
      DATAFORSEO_BASIC_AUTH_FILE: /run/secrets/dataforseo_auth
      DATAFORSEO_LOGIN: ''
      DATAFORSEO_PASSWORD: ''
    secrets:
      - source: dataforseo_auth
        target: dataforseo_auth
secrets:
  dataforseo_auth:
    file: ${DATAFORSEO_AUTH_HOST_FILE:?Set dataforseo auth secret path in private .env}
