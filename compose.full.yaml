# Isolated private deployment with a single shared SQLite volume.
# Paid DataForSEO and outbound Gmail sending remain disabled by default.
services:
  worker:
    build: ./engine
    restart: unless-stopped
    env_file: .env.worker
    environment:
      PR_DB_PATH: /app/state/outreach.sqlite3
      PR_RUN_INTERVAL_SECONDS: "14400"
      PR_MONITOR_INTERVAL_SECONDS: "3600"
    volumes:
      - backlink-state:/app/state
      - backlink-output:/app/output
    read_only: true
    tmpfs: ["/tmp"]
    user: "65534:65534"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 100
    mem_limit: 512m
  dashboard:
    build: .
    restart: unless-stopped
    depends_on: [worker]
    env_file: .env
    environment:
      PR_DB_PATH: /app/state/outreach.sqlite3
      # For SSH tunnel to 127.0.0.1; set true behind authenticated HTTPS.
      DASHBOARD_COOKIE_SECURE: "${DASHBOARD_COOKIE_SECURE:-true}"
      DASHBOARD_PROXY_SECRET: "${DASHBOARD_PROXY_SECRET:-}"
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - backlink-state:/app/state
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 100
    mem_limit: 256m
volumes:
  backlink-state:
  backlink-output:
