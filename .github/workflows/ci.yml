name: Verify LinkForge Cloudflare-only
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cloudflare-native API, security and scheduled worker tests
        run: npm test
      - name: Cloudflare Pages build checks
        run: npm run build
      - name: Confirm no public secrets or databases
        run: |
          test ! -f .env
          test ! -f .env.worker
          test ! -f DataforSEO_API.txt
          test ! -f wrangler.toml
          test ! -f workers/scheduler/wrangler.toml
          test ! -e state/outreach.sqlite3
          ! grep -R -i -E 'BEGIN PRIVATE KEY|ghp_[A-Za-z0-9]{28,}|DASHBOARD_ADMIN_PASSWORD=[^r]' functions/ workers/ public/ 2>/dev/null
