name: Verify LinkForge Cloudflare Pages
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Pages assets without secrets or server provisioning
        run: npm run build
      - name: Test direct GSC opportunity scoring without API credentials
        run: python3 -m unittest discover -s tests/gsc -p 'test_*.py'
      - name: Test browser workspace, Pages JSON routing and secure optional Worker
        run: npm test
      - name: Prevent recurrence of HTML-as-JSON Pages deploy error
        run: |
          test -f 'functions/api/[[path]].js'
          test -f public/_routes.json
          test -f public/browser-store.js
          test -f public/portfolio.json
          test ! -f wrangler.jsonc
          test -f worker.wrangler.jsonc
          node -e "const c=require('./public/_routes.json'); if(!c.include.includes('/api/*'))process.exit(1)"
      - name: Block public secret and DB artifacts
        run: |
          test ! -e .linkforge
          test ! -f DataforSEO_API.txt
          test ! -f .env
          test ! -f .env.worker
          test ! -f state/outreach.sqlite3
          ! grep -R -i -E 'BEGIN PRIVATE KEY|ghp_[A-Za-z0-9]{28,}|DATAFORSEO_PASSWORD=[^r]' src/ functions/ public/ 2>/dev/null
