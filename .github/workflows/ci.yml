name: Verify LinkForge unified Cloudflare Worker
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Single-Worker, D1, auth, scheduler and safe deploy tests
        run: npm test
      - name: Static JS and Worker build checks
        run: npm run build
      - name: Fail on tracked secrets or private data
        run: |
          test ! -e .linkforge
          test ! -f DataforSEO_API.txt
          test ! -f .env
          test ! -f .env.worker
          test ! -f state/outreach.sqlite3
          ! grep -R -i -E 'BEGIN PRIVATE KEY|ghp_[A-Za-z0-9]{28,}|DATAFORSEO_PASSWORD=[^r]' src/ functions/ public/ 2>/dev/null
