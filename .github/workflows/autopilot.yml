name: LinkForge Autopilot
# The autonomous engine. An hourly check starts a full cycle whenever the last one
# is 5+ hours old, so GitHub's late or dropped schedule slots are absorbed within
# the hour (about 4 cycles a day). Each cycle commits results, which redeploys
# Cloudflare Pages. No Cloudflare credentials needed.
on:
  schedule:
    # Backup to the send-window waker (the primary scheduler). GitHub drops many scheduled slots, so three
    # per hour make it far likelier that one fires; the "Is a cycle due?" step stops extra cycles.
    - cron: '7 * * * *'
    - cron: '23 * * * *'
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no emails, nothing committed)'
        type: boolean
        default: false
      ai_endpoint:
        description: 'AI writer endpoint override (testing a preview deployment only)'
        type: string
        default: ''
# Least privilege: nothing by default; each job asks only for what it uses.
permissions:
  contents: read
concurrency:
  group: linkforge-autopilot
  cancel-in-progress: false
jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      id-token: write # identity token for the dashboard's free AI pitch writer; no secret is stored
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      # Always the branch's newest commit, never the commit the trigger fired on: a run that waited behind
      # another cycle (concurrency) must start from that cycle's results. On 2026-11-25 a queued run started
      # from the older state file, repeated the previous cycle and emailed the same editors again.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Is a cycle due?
        id: due
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          MIN_HOURS: ${{ vars.AUTOPILOT_MIN_HOURS || '5' }}
        run: |
          node -e "
          const fs=require('fs');let last=0;
          try{last=Date.parse(JSON.parse(fs.readFileSync('public/data/autopilot.json','utf8')).generated_at)||0}catch{}
          const now=new Date(),h=now.getUTCHours(),weekday=now.getUTCDay()>0&&now.getUTCDay()<6;
          // Extra cycles every 2 h on weekdays 07-21 UTC: the EU and US send windows, so verified inboxes get emailed the same day.
          const hours=(Date.now()-last)/36e5;
          // A started run (dashboard, send-window waker) still never follows another cycle by under 10 minutes: that is a duplicate that queued behind it.
          const due=process.env.DRY_RUN==='1'||(process.env.EVENT!=='schedule'?hours*60>=10:hours>=Number(process.env.MIN_HOURS)||(weekday&&h>=7&&h<21&&hours>=2));
          console.log('Last cycle '+hours.toFixed(1)+' h ago; due: '+due);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'due='+due+String.fromCharCode(10))"
      - uses: actions/setup-node@v4
        if: steps.due.outputs.due == 'true'
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund --omit=dev
        if: steps.due.outputs.due == 'true'
      - name: Restore crawl cache
        if: steps.due.outputs.due == 'true'
        uses: actions/cache@v4
        with:
          path: .autopilot-cache
          key: autopilot-crawl-${{ github.run_id }}
          restore-keys: autopilot-crawl-
      - name: Run Autopilot cycle
        if: steps.due.outputs.due == 'true'
        env:
          AUTOPILOT_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          LINKFORGE_DATA_KEY: ${{ secrets.LINKFORGE_DATA_KEY }}
          LINKFORGE_VAULT_RESET_AT: ${{ secrets.LINKFORGE_VAULT_RESET_AT || vars.LINKFORGE_VAULT_RESET_AT }}
          LINKFORGE_SETTINGS: ${{ secrets.LINKFORGE_SETTINGS }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          # Free pitch writer: Cloudflare Workers AI behind the dashboard, authorised by this run's identity token.
          LINKFORGE_AI_ENDPOINT: ${{ inputs.ai_endpoint || vars.LINKFORGE_AI_ENDPOINT || 'https://backlink-command-center.pages.dev/api/ai/v1' }}
          LINKFORGE_CLOUDFLARE_MODEL: ${{ vars.LINKFORGE_CLOUDFLARE_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINKFORGE_AI_BASE_URL: ${{ vars.LINKFORGE_AI_BASE_URL }}
          LINKFORGE_AI_KEY: ${{ secrets.LINKFORGE_AI_KEY }}
          LINKFORGE_AI_MODEL: ${{ vars.LINKFORGE_AI_MODEL }}
          LINKFORGE_GROQ_MODEL: ${{ vars.LINKFORGE_GROQ_MODEL }}
          LINKFORGE_GEMINI_MODEL: ${{ vars.LINKFORGE_GEMINI_MODEL }}
          LINKFORGE_AI_WRITER: ${{ vars.LINKFORGE_AI_WRITER }}
          BRAVE_MONTHLY_REQUESTS: ${{ vars.BRAVE_MONTHLY_REQUESTS }}
          AUTOPILOT_NEIGHBOR_PAGES: ${{ vars.AUTOPILOT_NEIGHBOR_PAGES }}
          SENDER_POSTAL_ADDRESS: ${{ secrets.SENDER_POSTAL_ADDRESS }}
          SENDER_NAME: ${{ vars.SENDER_NAME }}
          OUTREACH_MODE: ${{ vars.OUTREACH_MODE }}
          OUTREACH_DAILY_LIMIT: ${{ vars.OUTREACH_DAILY_LIMIT }}
          FOLLOWUP_DAYS: ${{ vars.FOLLOWUP_DAYS }}
          DATAFORSEO_DAILY_USD: ${{ vars.DATAFORSEO_DAILY_USD }}
          DATAFORSEO_MONTHLY_USD: ${{ vars.DATAFORSEO_MONTHLY_USD }}
          LINKFORGE_CLAUDE_MODEL: ${{ vars.LINKFORGE_CLAUDE_MODEL }}
          # Verification is disabled until the owner supplies a real key and budget.
          # Verifalia (primary) uses only its free daily credits unless VERIFALIA_ALLOW_PAID=YES; Hunter is the fallback.
          VERIFALIA_USERNAME: ${{ secrets.VERIFALIA_USERNAME }}
          VERIFALIA_PASSWORD: ${{ secrets.VERIFALIA_PASSWORD }}
          VERIFALIA_QUALITY: ${{ vars.VERIFALIA_QUALITY }}
          VERIFALIA_ALLOW_PAID: ${{ vars.VERIFALIA_ALLOW_PAID }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          EMAIL_VERIFICATION_ENABLED: ${{ vars.EMAIL_VERIFICATION_ENABLED || 'NO' }}
          EMAIL_VERIFY_DAILY_LIMIT: ${{ vars.EMAIL_VERIFY_DAILY_LIMIT || '0' }}
          OUTREACH_HOLD: ${{ vars.OUTREACH_HOLD }}
        # Outbound hold lifted by the owner on 2026-11-05 after the recipient-verification gate
        # passed production checks (5 inboxes verified Deliverable via Verifalia).
        # Emergency brake: set repository variable OUTREACH_HOLD=YES to force OUTREACH_MODE=off
        # (research, mailbox reading and backlink checks keep running). The dashboard ■ Stop
        # button pauses the whole schedule.
        run: |
          node --input-type=module -e "
          let settings={};try{settings=JSON.parse(process.env.LINKFORGE_SETTINGS||'{}')}catch{}
          if(process.env.OUTREACH_HOLD==='YES'){process.env.LINKFORGE_SETTINGS=JSON.stringify({...settings,OUTREACH_MODE:'off'});console.log('OUTREACH_HOLD=YES: outbound email is held')}
          const {runAutopilot}=await import('./scripts/autopilot/run.mjs');
          await runAutopilot();"
      - name: Guard against leaking private data
        if: ${{ steps.due.outputs.due == 'true' && !inputs.dry_run }}
        run: |
          node -e "
          const fs=require('fs');const s=fs.readFileSync('public/data/autopilot.json','utf8');JSON.parse(s);
          if(/[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/i.test(s))throw Error('Public summary contains an email address');
          if(fs.existsSync('public/data/vault.json')){const v=JSON.parse(fs.readFileSync('public/data/vault.json','utf8'));if(v.alg!=='AES-256-GCM'||!v.ct)throw Error('Vault is not sealed')}"
      - name: Commit results (redeploys Cloudflare Pages)
        if: ${{ steps.due.outputs.due == 'true' && !inputs.dry_run }}
        run: |
          git config user.name "linkforge-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/autopilot.json
          [ -f public/data/vault.json ] && git add public/data/vault.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "autopilot: $(date -u +%Y-%m-%dT%H:%MZ) cycle"
          git fetch -q origin main
          if ! git diff --quiet HEAD~1 origin/main -- public/data/vault.json; then echo "::warning::The state file on main changed while this cycle ran. This cycle's state is kept; the Sent-folder check restores any send record the other change held."; fi
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          exit 1
      # The alert job reads this cycle's public summary (counts only) from here, even if the commit step failed.
      - name: Keep the public summary for the alert job
        if: ${{ always() && steps.due.outputs.due == 'true' && !inputs.dry_run }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-summary
          path: public/data/autopilot.json
          retention-days: 3
          if-no-files-found: ignore
  # GitHub emails the owner about new issues, so a stall or a decision the owner owes reaches them within a cycle.
  # One issue per 'action' code (plus the early warnings in notify.mjs WARN_CODES); updated in place, closed when it clears.
  # Its own job: only this token may write issues, and it never runs next to dependency installs, untrusted pages or
  # mail, or the vault key. Optional repository variable LINKFORGE_ALERT_MENTION = a GitHub login to @mention on open.
  alert:
    needs: autopilot
    if: ${{ always() && needs.autopilot.outputs.due == 'true' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # owner alerts: one issue per problem Autopilot cannot fix by itself (counts only, no prospect data)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          sparse-checkout: scripts/autopilot/notify.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch this cycle's public summary
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: autopilot-summary
          path: cycle-summary
      - name: Alert the owner (GitHub issues)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LINKFORGE_ALERT_MENTION: ${{ vars.LINKFORGE_ALERT_MENTION }}
        run: node scripts/autopilot/notify.mjs cycle-summary/autopilot.json
