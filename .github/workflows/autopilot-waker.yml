name: LinkForge Send-Window Waker
# The primary scheduler. GitHub starts the hourly Autopilot schedule only 2-3 times a day at random
# hours, and on 2026-11-25/26 skipped it for 4-10 hours at a time. This job waits until the next
# recipient send window, or at most 5 h (keep-alive), with cycles at least 2 h apart, then starts one
# Autopilot cycle (waiting is free on public repositories).
#
# A cycle started with this workflow's token does not fire `workflow_run` (GitHub's recursion guard), so
# the chain used to stop after one hop. The waker therefore starts its own successor (workflow_dispatch
# is exempt from that guard). Cron-started cycles and dashboard runs re-enter through `workflow_run`.
# The dashboard's Stop button disables Autopilot: the start then fails and the chain ends.
#
# One chain, never cancelled from outside. Concurrency is set on the job, not the workflow, and never
# cancels a run in progress:
#  - a waker whose job is skipped (its Autopilot run failed or was cancelled, or ran on another branch)
#    never enters the group, so it cannot touch the live chain (a workflow-level group with
#    cancel-in-progress used to cancel the live chain at that point and leave nothing running);
#  - a cron-started waker waits as "pending" behind the live chain and is replaced by the chain's own
#    successor (GitHub keeps one pending run per group), so there is always exactly one chain; if the
#    chain dies, the pending waker takes over;
#  - instead of a takeover, the live chain re-plans every 10 minutes from the newest published results,
#    so a send window found by another cycle (cron or dashboard) is still caught on time.
# GitHub API calls are retried (3 tries, 15 s and 45 s apart): one transient error no longer ends the chain.
on:
  workflow_run:
    workflows: [LinkForge Autopilot]
    types: [completed]
  workflow_dispatch:
    inputs:
      after:
        description: 'Set by the waker itself: when it started the cycle this run follows (ISO time)'
        required: false
        default: ''
permissions:
  actions: write
  contents: read
jobs:
  wake:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 345
    concurrency:
      group: linkforge-waker
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for the cycle that was just started to publish its results
        if: github.event_name == 'workflow_dispatch' && inputs.after != ''
        env:
          AFTER: ${{ inputs.after }}
        run: |
          for i in $(seq 1 50); do
            git fetch -q origin main && git checkout -q FETCH_HEAD -- public/data/autopilot.json
            if node scripts/autopilot/waker.mjs fresh "$AFTER"; then echo "The cycle published its results"; break; fi
            sleep 30
          done
      - name: Wait until the next cycle is due (re-planned every 10 minutes from the newest results)
        id: plan
        env:
          WAKER_AFTER: ${{ github.event_name == 'workflow_dispatch' && inputs.after || '' }}
        run: |
          # Hand over to a successor well before this job's 345-minute limit.
          END=$(( $(date +%s) + 270*60 ))
          while :; do
            git fetch -q origin main && git checkout -q FETCH_HEAD -- public/data/autopilot.json || echo "Could not refresh the results; planning from the last copy"
            node scripts/autopilot/waker.mjs plan > "$RUNNER_TEMP/plan.txt"
            WAKE="$(sed -n 's/^wake=//p' "$RUNNER_TEMP/plan.txt")"
            WAIT="$(sed -n 's/^wait_s=//p' "$RUNNER_TEMP/plan.txt")"
            case "$WAIT" in ''|*[!0-9]*) WAIT=0 ;; esac
            if [ "$WAKE" != "true" ]; then echo "wake=false" >> "$GITHUB_OUTPUT"; exit 0; fi
            if [ "$WAIT" -le 0 ]; then echo "wake=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            if [ "$(date +%s)" -ge "$END" ]; then echo "wake=handover" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep $(( WAIT < 600 ? WAIT : 600 ))
          done
      - name: Start an Autopilot cycle and the next waker
        if: steps.plan.outputs.wake == 'true' || steps.plan.outputs.wake == 'handover'
        env:
          GH_TOKEN: ${{ github.token }}
          WAKE: ${{ steps.plan.outputs.wake }}
          WAKER_AFTER: ${{ github.event_name == 'workflow_dispatch' && inputs.after || '' }}
        run: |
          retry() { for pause in 0 15 45; do sleep "$pause"; if "$@"; then return 0; fi; done; return 1; }
          # A hand-over keeps this run's spacing; a successor after a started cycle waits for that cycle.
          STARTED="$WAKER_AFTER"
          if [ "$WAKE" = "true" ]; then
            STARTED=""
            git fetch -q origin main && git checkout -q FETCH_HEAD -- public/data/autopilot.json
            if node scripts/autopilot/waker.mjs recheck; then
              NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              if retry gh workflow run autopilot.yml --ref main; then
                STARTED="$NOW"
              else
                STATE="$(retry gh api "repos/$GITHUB_REPOSITORY/actions/workflows/autopilot.yml" --jq .state || true)"
                case "$STATE" in
                  *disabled*|*deleted*)
                    echo "Autopilot is stopped (workflow disabled); no cycle started and the chain ends here"
                    exit 0 ;;
                esac
                # Still active (or unknown): keep the chain, and let the successor wait the normal 2 h gap
                # before trying again, so repeated failures cannot spin.
                echo "::warning::Could not start an Autopilot cycle after 3 tries; the next waker tries again in about 2 h"
                STARTED="$NOW"
              fi
            fi
          fi
          # Keep the chain alive: this run's own successor plans the cycle after this one.
          retry gh workflow run autopilot-waker.yml --ref main -f after="$STARTED"
