# OPTIONAL secure Cloudflare Tunnel ingress for the private FastAPI dashboard.
# Use with compose.full.yaml on the RackNerd VPS. This exposes NO host port.
# Route the private API hostname in Cloudflare Zero Trust to http://dashboard:8080.
# All backend HTTP requests require X-Backlink-Proxy-Token from Pages Functions.
services:
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Configure a tunnel token privately on your VPS}
    depends_on:
      - dashboard
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 60
    mem_limit: 128m
