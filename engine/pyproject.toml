[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "portfolio-editorial-outreach"
version = "0.4.1"
description = "Ten-site evidence-led digital PR research, prospect verification, outreach and outcome monitoring"
requires-python = ">=3.11"
dependencies = ["requests>=2.31,<3"]
[project.scripts]
portfolio-pr = "portfolio_pr.cli:main"
[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
